<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Interactive Page</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1> JavaScript Practice</h1>
        <p> Learning how to make webpages interactive.</p>
    </header>

    <main>
        <section class= "card">
            <h2> Change Text and Colour</h2>
            <p id="message"> Hello! Click the button below.</p>
            <button id="changeBtn">Click Me!</button>
        </section>

        <section class="card">
            <h2>Counter</h2>
            <p id="count">0</p>

            <div class="buttons">
                <button id="decreaseBtn">Decrease</button>
                <button id="increaseBtn">Increase</button>
            </div>

        </section>
    </main>
    
    <footer>
        <p> JavaScript Learning Project</p>
    </footer>
    
</body>
</html>
